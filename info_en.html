<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EdgeGuard - Q&A Menu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="info.css">
</head>
<body>
    <div class="background-glow"></div>

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="logo">
            <img src="logo.svg" alt="Dranvi" class="logo-img" onerror="if(!this.dataset.fallback){this.dataset.fallback='png'; this.src='logo.png';}else{this.style.display='none'; this.nextElementSibling.style.display='inline';}">
            <span class="logo-text" style="display:none;">Dranvi</span><span>EdgeGuard</span>
        </div>
        <div class="action-buttons">
            <a href="index.html" class="back-btn">Main Site</a>
            <a href="info.html" class="lang-btn">KR</a>
        </div>
    </div>

    <!-- Menu Header -->
    <div class="menu-header">
        <h1 class="menu-title">What are you curious about EdgeGuard?</h1>
        <p class="menu-subtitle">Touch any button to explore the details.</p>
    </div>

    <!-- 2x3 Grid Menu -->
    <div class="grid-container">
        <!-- 1️⃣ What is it? -->
        <a href="info_1_en.html" class="grid-item">
            <span class="grid-num">1</span>
            <span class="grid-label">What is it?</span>
        </a>

        <!-- 2️⃣ Why needed? -->
        <a href="info_2_en.html" class="grid-item">
            <span class="grid-num">2</span>
            <span class="grid-label">Why needed?</span>
        </a>

        <!-- 3️⃣ Is it effective? -->
        <a href="info_3_en.html" class="grid-item">
            <span class="grid-num">3</span>
            <span class="grid-label">Is it effective?</span>
        </a>

        <!-- 4️⃣ Where to use? -->
        <a href="info_4_en.html" class="grid-item">
            <span class="grid-num">4</span>
            <span class="grid-label">Where to use?</span>
        </a>

        <!-- 5️⃣ What's different? -->
        <a href="info_5_en.html" class="grid-item">
            <span class="grid-num">5</span>
            <span class="grid-label">What's different?</span>
        </a>

        <!-- 0️⃣ QR Code -->
        <div class="qr-static-card">
            <div class="qr-grid-wrapper">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=110x110&color=3b82f6&bgcolor=080808&data=https://www.dranvi.com" alt="Dranvi QR Code" class="qr-grid-image">
            </div>
            <span class="grid-label" style="font-size: 1rem; margin-top: 0.2rem;">dranvi.com</span>
        </div>
    </div>
</body>
</html>
