<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>DRANVI FAMILY Admin</title>
    <meta name="description" content="DRANVI FAMILY 관리자 페이지">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../family-os.css">
    <script src="../admin-guard.js"></script>
</head>

<body class="family-os">
    <div class="family-shell">
        <nav class="family-nav">
            <a class="family-brand" href="../">
                <img src="../logo.svg" alt="Dranvi">
            </a>
            <div class="family-nav-links">
                <a href="../family/">Family</a>
                <a href="../timeline/">Timeline</a>
                <a href="../admin/">Admin</a>
            </div>
        </nav>

        <main>
            <section class="qr-head">
                <p class="eyebrow">Admin</p>
                <h1>DRANVI FAMILY 관리</h1>
                <p class="qr-copy">개체 목록을 게시판처럼 보고, 선택해서 바로 수정합니다.</p>
            </section>

            <section class="family-panel" id="admin-login" hidden>
                <h2>관리자 로그인</h2>
                <form class="family-form" id="admin-login-form">
                    <label>
                        ID
                        <input name="user" type="text" value="admin" required>
                    </label>
                    <label>
                        비밀번호
                        <input name="password" type="password" required>
                    </label>
                    <button class="primary-button" type="submit">로그인</button>
                    <p class="form-note" id="admin-login-note">로컬 관리자 비밀번호를 입력해 주세요.</p>
                </form>
            </section>

            <div id="admin-content" hidden>
                <section class="admin-managed">
                    <div class="managed-head">
                        <div>
                            <p class="section-label">Board</p>
                            <h2>개체 게시판</h2>
                        </div>
                        <button class="soft-button" id="download-admin-json" type="button">JSON 다운로드</button>
                    </div>
                    <div class="managed-list" id="managed-plants"></div>
                </section>

                <section class="admin-create">
                    <div class="editor-head">
                        <div>
                            <p class="section-label">Editor</p>
                            <h2 id="editor-title">새 개체 만들기</h2>
                        </div>
                        <button class="soft-button" id="cancel-edit" type="button" hidden>수정 취소</button>
                    </div>

                    <section class="admin-layout">
                        <form class="family-form family-panel" id="admin-form">
                            <label>
                                개체 번호
                                <input id="admin-number" name="number" type="text" value="004" required>
                            </label>
                            <label>
                                개체 이름
                                <textarea name="name" required>에리온 소르미아
라리에르 루미스
예쁨 오르비아 ♡</textarea>
                            </label>
                            <label>
                                보호자
                                <input name="guardian" type="text" value="에리온" required>
                            </label>
                            <label>
                                위치
                                <input name="location" type="text" value="Guardian Space">
                            </label>
                            <label>
                                입양일
                                <input id="admin-date" name="adoptionDate" type="text">
                            </label>
                            <label>
                                특이사항
                                <textarea name="description">골드 에디션
비매각
비양도
특별 보호자</textarea>
                            </label>
                            <label data-create-only>
                                첫 기록 제목
                                <input name="firstTitle" type="text" value="입양 준비 완료!">
                            </label>
                            <label data-create-only>
                                짧은 편지
                                <textarea name="letter">이 작은 식물은 오늘부터 보호자님과 함께 자라납니다. 드란비가 관계를 기억하는 방식으로, 첫 시간을 남겨둡니다.</textarea>
                            </label>
                            <label>
                                접근 키
                                <span class="key-row">
                                    <input id="admin-key-input" name="key" type="text" required>
                                    <button class="soft-button" id="make-key" type="button">새 키</button>
                                </span>
                            </label>
                            <button class="primary-button" id="admin-submit" type="submit">개체 생성 + QR 등록</button>
                            <p class="form-note" id="key-hint">생성하면 위 목록에서 QR을 다시 확인할 수 있습니다.</p>
                        </form>

                        <aside class="admin-output family-panel" id="admin-output" hidden>
                            <h2>QR 미리보기</h2>
                            <div class="qr-frame">
                                <img id="admin-qr" src="" alt="Generated QR">
                            </div>
                            <div class="link-output" id="admin-link"></div>
                        </aside>
                    </section>
                </section>
            </div>
        </main>
    </div>

    <script src="../family-data.js"></script>
    <script src="../admin-app.js"></script>
</body>

</html>
